version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadzaro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadzaro
      POSTGRES_USER: leadzaro_user
      POSTGRES_PASSWORD: leadzaro_pass
    ports:
      - '5432:5432'
    volumes:
      - leadzaro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadzaro_user -d leadzaro']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  leadzaro_pgdata:
